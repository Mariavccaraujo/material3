<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos</title>
  <style>
    :root {
      --fundo: #f4f6f9;
      --texto: #333;
      --suave: #777;
      --verde: #27ae60;
      --vermelho: #c0392b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--fundo);
      color: var(--texto);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 4px;
    }

    .barra {
      max-width: 1000px;
      margin: 20px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .barra input,
    .barra select {
      padding: 10px 12px;
      border: 1px solid #d5dae1;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      min-width: 200px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 20px auto;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
      background: #eceff3;
    }

    .card h3 {
      margin: 12px 0 4px;
      font-size: 16px;
    }

    .categoria {
      display: inline-block;
      background-color: #e0e0e0;
      color: #555;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      margin-top: 4px;
    }

    .preco {
      font-size: 18px;
      font-weight: bold;
      color: var(--verde);
      margin: 10px 0;
    }

    .estoque { font-size: 12px; color: var(--suave); }
    .estoque.esgotado { color: var(--vermelho); font-weight: bold; }

    #aviso {
      max-width: 1000px;
      margin: 20px auto;
      text-align: center;
      color: var(--suave);
    }

    #aviso.erro {
      color: var(--vermelho);
      background: #fdecea;
      border: 1px solid #f5c6c0;
      border-radius: 8px;
      padding: 14px;
      text-align: left;
    }

    #aviso code {
      background: rgba(0,0,0,.06);
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>Catálogo de Produtos</h1>

  <div class="barra">
    <input type="search" id="busca" placeholder="Buscar produto..." aria-label="Buscar produto">
    <select id="filtro-categoria" aria-label="Filtrar por categoria">
      <option value="">Todas as categorias</option>
    </select>
  </div>

  <div id="aviso">Carregando produtos...</div>
  <div id="produtos-container" class="grid"></div>

  <script>
    const container = document.getElementById('produtos-container');
    const aviso = document.getElementById('aviso');
    const busca = document.getElementById('busca');
    const filtroCategoria = document.getElementById('filtro-categoria');

    let produtos = [];

    function formatarPreco(valor) {
      return Number(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function escapar(texto) {
      return String(texto ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function montarCard(produto) {
      const card = document.createElement('div');
      card.className = 'card';

      const esgotado = Number(produto.estoque) <= 0;
      const imagem = produto.imagem || 'https://placehold.co/600x400?text=Sem+imagem';

      card.innerHTML = `
        <img src="${escapar(imagem)}" alt="${escapar(produto.nome)}" loading="lazy">
        <h3>${escapar(produto.nome)}</h3>
        <span class="categoria">${escapar(produto.categoria)}</span>
        <div class="preco">${formatarPreco(produto.preco)}</div>
        <div class="estoque ${esgotado ? 'esgotado' : ''}">
          ${esgotado ? 'Esgotado' : 'Estoque: ' + produto.estoque + ' un.'}
        </div>
      `;
      return card;
    }

    function renderizar() {
      const termo = busca.value.trim().toLowerCase();
      const categoria = filtroCategoria.value;

      const lista = produtos.filter(p => {
        const combinaTermo = p.nome.toLowerCase().includes(termo);
        const combinaCategoria = !categoria || p.categoria === categoria;
        return combinaTermo && combinaCategoria;
      });

      container.innerHTML = '';
      lista.forEach(p => container.appendChild(montarCard(p)));

      if (lista.length === 0) {
        aviso.className = '';
        aviso.textContent = 'Nenhum produto encontrado com esses filtros.';
      } else {
        aviso.className = '';
        aviso.textContent = `${lista.length} produto(s) no catálogo.`;
      }
    }

    function preencherCategorias() {
      const categorias = [...new Set(produtos.map(p => p.categoria))].sort();
      categorias.forEach(c => {
        const opcao = document.createElement('option');
        opcao.value = c;
        opcao.textContent = c;
        filtroCategoria.appendChild(opcao);
      });
    }

    async function carregarBanco() {
      try {
        // Caminho relativo: banco.json precisa estar na mesma pasta deste HTML
        const resposta = await fetch('./banco.json', { cache: 'no-store' });

        if (!resposta.ok) {
          throw new Error(`HTTP ${resposta.status}`);
        }

        const dados = await resposta.json();

        if (!dados || !Array.isArray(dados.produtos)) {
          throw new Error('O JSON precisa ter uma lista chamada "produtos".');
        }

        produtos = dados.produtos;
        preencherCategorias();
        renderizar();

      } catch (erro) {
        console.error('Erro na leitura do banco JSON:', erro);
        aviso.className = 'erro';

        if (location.protocol === 'file:') {
          aviso.innerHTML = `
            <strong>O navegador bloqueou a leitura do JSON.</strong><br>
            Isso acontece quando a página é aberta com duplo clique (<code>file://</code>).
            Publique no GitHub Pages ou rode um servidor local:
            <code>python -m http.server</code> e acesse <code>http://localhost:8000</code>.
          `;
        } else {
          aviso.innerHTML = `
            <strong>Não foi possível carregar o banco.json.</strong><br>
            Confira se o arquivo está na mesma pasta do HTML e se o nome está exatamente
            <code>banco.json</code>. Detalhe técnico: ${escapar(erro.message)}
          `;
        }
      }
    }

    busca.addEventListener('input', renderizar);
    filtroCategoria.addEventListener('change', renderizar);

    carregarBanco();
  </script>
</body>
</html>
